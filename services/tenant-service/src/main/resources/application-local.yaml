# =====================================================================
# MIRO ERP — tenant-service
# Ambiente: LOCAL
# Descripción: Configuración para desarrollo local con Docker
# =====================================================================

spring:

  # ─── BASE DE DATOS ──────────────────────────────────────────────
  # PostgreSQL corriendo en Docker — docker-compose up -d
  # ${VAR:default} → usa la variable de entorno
  #                  si no existe → usa el valor por defecto
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:miroapp}
    username: ${POSTGRES_USER:miroapp_user}
    password: ${POSTGRES_PASSWORD:miroapp_pass}
    driver-class-name: org.postgresql.Driver

  # ─── JPA / HIBERNATE ────────────────────────────────────────────
  jpa:
    hibernate:
      # validate → Hibernate solo verifica, nunca modifica la BD
      # Flyway es el único que crea y altera tablas
      ddl-auto: validate
    # Solo en local → ver queries SQL en la consola
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  # ─── FLYWAY ─────────────────────────────────────────────────────
  # Al arrancar → lee db/migration → ejecuta scripts pendientes
  # baseline-on-migrate → no falla si la BD ya tiene tablas
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true