# =====================================================================
# PRODUCT SERVICE — Configuración local
# =====================================================================

spring:

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:miroapp}
    username: ${POSTGRES_USER:miroapp_user}
    password: ${POSTGRES_PASSWORD:miroapp_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # none → JPA no toca el schema.
      # El schema del tenant fue creado por tenant-service con Flyway.
      # product-service solo opera en él — no lo crea ni lo modifica.
      ddl-auto: none
    show-sql: true
    open-in-view: false      # ← agregar esta línea
    properties:
      hibernate:
        format_sql: true

  flyway:
    # Flyway ejecuta las migraciones V3+ en el schema del tenant.
    # baseline-on-migrate → si la tabla flyway_schema_history
    # no existe, la crea automáticamente.
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration/product-service

# =====================================================================
# JWT — mismo secret que auth-service y gateway-service
# El secret DEBE ser idéntico en los tres servicios.
# auth-service lo usa para FIRMAR el token.
# gateway-service lo usa para VALIDAR el token.
# product-service lo usa para LEER los claims del token.
# =====================================================================
jwt:
  secret: ${JWT_SECRET:miroapp-secret-key-local-development-2026-very-long-key}
  expiration: ${JWT_EXPIRATION:86400000}