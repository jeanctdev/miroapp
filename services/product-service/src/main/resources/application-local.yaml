# =====================================================================
# PRODUCT SERVICE — Configuración local
# =====================================================================

spring:

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:miroapp}
    username: ${POSTGRES_USER:miroapp_user}
    password: ${POSTGRES_PASSWORD:miroapp_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # none → JPA no crea ni modifica tablas.
      # Las tablas ya existen — creadas por tenant-service via Flyway V1.
      # product-service solo opera sobre ellas.
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    # false → product-service NO ejecuta migraciones.
    # tenant-service es el único dueño de las migraciones del schema tenant.
    enabled: false

# =====================================================================
# JWT — mismo secret que auth-service y gateway-service
# El secret DEBE ser idéntico en los tres servicios.
# auth-service → FIRMA el token
# gateway-service → VALIDA el token
# product-service → LEE los claims del token
# =====================================================================
jwt:
  secret: ${JWT_SECRET:miroapp-secret-key-local-development-2026-very-long-key}
  expiration: ${JWT_EXPIRATION:86400000}