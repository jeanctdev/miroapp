# == Errores de autenticaci\uFFFDn JWT # =================================
gateway.error.token.missing=Token de autorizacion no encontrado. Incluye el header: Authorization: Bearer <token>
gateway.error.token.invalid=Token invalido o expirado. Inicia sesion nuevamente para obtener un token valido.
gateway.error.token.unauthorized=No tienes permiso para acceder a este recurso.

# == Errores de conectividad con microservicios =================================
gateway.error.service.unavailable=El servicio no esta disponible en este momento. Intenta mas tarde.
gateway.error.service.timeout=El servicio tardo demasiado en responder. Intenta nuevamente en unos segundos.

# == Errores generales del gateway =================================
gateway.error.bad.request=La solicitud no tiene el formato correcto.
gateway.error.internal=Error interno del gateway. Contacta al soporte si el problema persiste.