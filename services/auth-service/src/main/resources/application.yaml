    active: ${SPRING_PROFILES_ACTIVE:local}

# ─── SERVIDOR ─────────────────────────────────────────────────────────
server:
  port: 8081

# ─── LOGGING ──────────────────────────────────────────────────────────
logging:
  level:
    com.miroapp: DEBUG
    org.flywaydb: INFO