# =====================================================================
# MIRO ERP — auth-service
# Ambiente: LOCAL
# =====================================================================

spring:

  # ─── BASE DE DATOS ────────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:miroapp}
    username: ${POSTGRES_USER:miroapp_user}
    password: ${POSTGRES_PASSWORD:miroapp_pass}
    driver-class-name: org.postgresql.Driver

  # ─── JPA / HIBERNATE ──────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  # ─── FLYWAY ───────────────────────────────────────────────────────
  # false → auth-service NO ejecuta migraciones.
  # auth-service lee la tabla users del schema de cada TENANT
  # (vía TenantContext), no tiene tablas propias en public.
  # tenant-service es el único dueño de las migraciones.
  flyway:
    enabled: false

# ─── JWT ──────────────────────────────────────────────────────────────
# secret → clave secreta para firmar los tokens
# expiration → tiempo de vida del token en milisegundos
# 86400000 = 24 horas
jwt:
  secret: ${JWT_SECRET:miroapp-secret-key-local-development-2026-very-long-key}
  expiration: ${JWT_EXPIRATION:86400000}
